<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoadBoot — Carrier Dispatcher tab preview</title>
<style>/* carrier.css — LoadBoot Carrier Portal. Responsive dashboard: sidebar on desktop,
   bottom tab bar on mobile. Professional, enterprise-grade look. */
:root { --cp-side: #0b1220; --cp-side2: #111c33; }
* { box-sizing: border-box; }
body { background: var(--lb-bg, #f4f6fb); margin: 0; font-family: var(--lb-font, 'Inter', system-ui, sans-serif); color: #10223B; }

/* loading / auth */
.lb-state { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--lb-muted, #64748b); }
.lb-spinner { width: 34px; height: 34px; border: 3px solid #dbe3ef; border-top-color: var(--lb-blue, #0883F7); border-radius: 50%; animation: cpspin .8s linear infinite; }
@keyframes cpspin { to { transform: rotate(360deg); } }
.cp-auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, #0b1220 60%); }
.cp-auth-card { width: 100%; max-width: 420px; background: #fff; border-radius: 18px; padding: 30px 26px; box-shadow: 0 30px 80px -30px rgba(2,6,23,.6); }
.cp-auth-card h1 { font-size: 1.5rem; margin: 6px 0 2px; font-family: var(--lb-head, inherit); }
.cp-auth-sub { color: var(--lb-muted, #64748b); font-size: .92rem; margin: 0 0 16px; }
.cp-lbl { display: block; font-weight: 600; font-size: .82rem; margin: 12px 0 5px; }
.cp-err { font-size: .85rem; margin-top: 10px; min-height: 1em; color: var(--lb-red, #dc2626); }
.cp-err.ok { color: var(--lb-green, #16a34a); }
.cp-auth-toggle { font-size: .86rem; color: var(--lb-muted, #64748b); margin-top: 14px; }
.cp-auth-toggle a, .cp-staff a { color: var(--lb-blue, #0883F7); font-weight: 700; cursor: pointer; text-decoration: none; }
.cp-staff { margin-top: 20px; padding-top: 16px; border-top: 1px solid #e9eef5; font-size: .82rem; color: var(--lb-muted, #64748b); text-align: center; }

/* brand */
.cp-brand { font-weight: 800; font-size: 1.15rem; letter-spacing: -.3px; color: #fff; display: flex; align-items: baseline; gap: 2px; }
.cp-brand b { color: #60a5fa; } /* FINAL CANON: boot BLUE (DAHOQsSkUjs) */
.cp-brand .cp-brand-sub { margin-left: 8px; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #93a4c4; }
.cp-brand-dark { color: #0b1220; }
.cp-brand-dark b { color: var(--lb-blue, #0883F7); } /* FINAL CANON: boot BLUE */
.cp-brand-dark .cp-brand-sub { color: var(--lb-blue, #0883F7); }

/* shell layout */
.cp-shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.cp-side { background: linear-gradient(180deg, var(--cp-side) 0%, var(--cp-side2) 100%); color: #cdd7ea; padding: 22px 16px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.cp-nav { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.cp-navlink { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 11px; color: #aab6cf; font-weight: 600; font-size: .92rem; text-decoration: none; cursor: pointer; transition: background .15s, color .15s; }
.cp-navlink:hover { background: rgba(255,255,255,.06); color: #fff; }
.cp-navlink.active { background: linear-gradient(135deg, #0883F7, #1d4ed8); color: #fff; box-shadow: 0 10px 24px -12px rgba(37,99,235,.8); }
.cp-ic { display: inline-flex; vertical-align: -.15em; }
.cp-side-foot { margin-top: auto; border-top: 1px solid rgba(255,255,255,.08); padding-top: 14px; }
.cp-carrier-name { color: #fff; font-weight: 700; font-size: .9rem; }
.cp-carrier-mail { color: #8295b5; font-size: .76rem; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cp-side-out { margin-top: 12px; width: 100%; display: flex; align-items: center; gap: 8px; justify-content: center; background: rgba(255,255,255,.07); color: #cdd7ea; border: 0; border-radius: 10px; padding: 9px; font-weight: 600; font-size: .85rem; cursor: pointer; }
.cp-side-out:hover { background: rgba(255,255,255,.13); color: #fff; }

.cp-main { min-width: 0; display: flex; flex-direction: column; }
.cp-top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.86); backdrop-filter: blur(8px); border-bottom: 1px solid var(--lb-border, #e6ebf3); display: flex; align-items: center; justify-content: space-between; padding: 14px 26px; }
.cp-top-title { font-size: 1.25rem; font-family: var(--lb-head, inherit); margin: 0; }
.cp-top-right { display: flex; align-items: center; gap: 12px; }
.cp-iconbtn { background: #fff; border: 1px solid var(--lb-border, #e6ebf3); border-radius: 10px; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; color: #475569; cursor: pointer; }
.cp-iconbtn:hover { color: var(--lb-blue, #0883F7); border-color: #c9d6ec; }
.cp-avatar { width: 38px; height: 38px; border-radius: 50%; background: none; padding: 0; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; }
.cp-bell { position: relative; }
.cp-bell-badge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #dc2626; color: #fff; font-size: .66rem; font-weight: 800; line-height: 1; display: inline-flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 2px 7px -1px rgba(220,38,38,.55); }
.cp-bell-badge[hidden] { display: none; }
.cp-chip-btn { border: none; cursor: pointer; transition: .15s; }
.cp-attn-pulse { animation: cpAttn 1.9s ease-in-out infinite; }
@keyframes cpAttn { 0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,.5); } 60% { box-shadow: 0 0 0 7px rgba(245,158,11,0); } }
@media (prefers-reduced-motion: reduce) { .cp-attn-pulse { animation: none; } }
/* Amazon-style trip tracker */
.cp-steps { display: flex; align-items: flex-start; margin: 14px 2px 6px; }
.cp-step { display: flex; flex-direction: column; align-items: center; flex: none; }
.cp-step-dot { width: 24px; height: 24px; border-radius: 50%; background: #e2e8f0; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 800; border: 2px solid #e2e8f0; transition: .2s; }
.cp-step.done .cp-step-dot { background: #16a34a; border-color: #16a34a; color: #fff; }
.cp-step.current .cp-step-dot { background: var(--lb-blue, #0883F7); border-color: var(--lb-blue, #0883F7); color: #fff; box-shadow: 0 0 0 4px rgba(8,131,247,.18); }
.cp-step-lbl { font-size: .64rem; font-weight: 700; color: #94a3b8; margin-top: 6px; white-space: nowrap; }
.cp-step.done .cp-step-lbl, .cp-step.current .cp-step-lbl { color: var(--lb-navy, #0f172a); }
.cp-step-line { flex: 1; height: 3px; background: #e2e8f0; margin: 11px -4px 0; border-radius: 2px; }
.cp-step-line.done { background: #16a34a; }
.cp-chip-btn.warn:hover { filter: brightness(.96); box-shadow: 0 0 0 3px rgba(180,83,9,.15); }
.cp-chip { font-size: .74rem; font-weight: 700; padding: 5px 11px; border-radius: 20px; }
.cp-chip.ok { background: #dcfce7; color: #15803d; } .cp-chip.warn { background: #fef3c7; color: #b45309; }
.cp-content { padding: 22px 26px 90px; }

/* kpis & stats */
.cp-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.cp-stat { display: flex; align-items: center; gap: 13px; background: #fff; border: 1px solid var(--lb-border, #e6ebf3); border-radius: 16px; padding: 16px 18px; text-align: left; cursor: default; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
.cp-stat.clickable { cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
.cp-stat.clickable:hover { transform: translateY(-2px); border-color: #c9d6ec; box-shadow: 0 16px 34px -22px rgba(37,99,235,.5); }
.cp-stat-ic { width: 42px; height: 42px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.cp-stat.blue .cp-stat-ic { background: #dbeafe; color: #1d4ed8; } .cp-stat.green .cp-stat-ic { background: #dcfce7; color: #15803d; }
.cp-stat.amber .cp-stat-ic { background: #fef3c7; color: #b45309; } .cp-stat.violet .cp-stat-ic { background: #ede9fe; color: #6d28d9; }
.cp-stat-v { font-size: 1.5rem; font-weight: 800; color: #0b1220; line-height: 1.1; text-transform: capitalize; }
.cp-stat-l { font-size: .8rem; color: var(--lb-muted, #64748b); margin-top: 2px; }

/* grid + cards */
.cp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.cp-card { background: #fff; border: 1px solid var(--lb-border, #e6ebf3); border-radius: 16px; padding: 18px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
/* 29 Aug 2026 — breathing room between stacked cards. Most tabs mount cards as bare
   siblings in a plain div, so consecutive cards sat flush against each other. A gap only
   between ADJACENT cards (not margin-bottom on every card) leaves grids, single cards and
   inline margin-top overrides exactly as they were; cp-grid children keep their own gap. */
.cp-content .cp-card + .cp-card { margin-top: 14px; }
.cp-grid > .cp-card + .cp-card { margin-top: 0; }
.cp-col2 { grid-column: span 2; }
.cp-cardhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cp-cardhead h3 { font-size: 1rem; margin: 0; }
.cp-cardhead-sub { font-size: .8rem; color: var(--lb-muted, #64748b); }
.cp-link { background: none; border: 0; color: var(--lb-blue, #0883F7); font-weight: 700; font-size: .82rem; cursor: pointer; }
.cp-muted { color: var(--lb-muted, #64748b); font-size: .9rem; text-align: center; padding: 26px; }

/* rows */
.cp-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid #f1f5f9; }
.cp-row:last-child { border-bottom: 0; }
.cp-row-t { font-weight: 700; font-size: .9rem; }
.cp-row-s { font-size: .78rem; color: var(--lb-muted, #64748b); margin-top: 2px; }
.cp-rowbtn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #f8fafc; border: 1px solid #eef2f8; border-radius: 11px; padding: 12px 14px; margin-bottom: 8px; font-weight: 600; font-size: .9rem; color: #10223B; cursor: pointer; text-align: left; }
.cp-rowbtn:hover { background: #eef4ff; border-color: #cfe0ff; }
.cp-go { color: #94a3b8; font-weight: 700; font-size: 1.1rem; }

/* pills */
.cp-pill { font-size: .72rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: #eef2f7; color: #475569; text-transform: capitalize; white-space: nowrap; }
.cp-pill.blue { background: #dbeafe; color: #1d4ed8; } .cp-pill.green { background: #dcfce7; color: #15803d; }
.cp-pill.amber { background: #fef3c7; color: #b45309; } .cp-pill.red { background: #fee2e2; color: #b91c1c; } .cp-pill.gray { background: #eef2f7; color: #475569; }

/* charts */
.cp-chart { width: 100%; } .cp-chart svg { display: block; }
.cp-legend { display: flex; gap: 18px; margin-top: 10px; font-size: .82rem; color: var(--lb-muted, #64748b); }
.cp-legend b { color: #0b1220; }
.cp-donut-wrap { display: flex; align-items: center; gap: 16px; }
.cp-donut-leg { font-size: .82rem; color: #475569; display: flex; flex-direction: column; gap: 6px; }
.cp-donut-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; }

/* announcements */
.cp-ann { border-radius: 13px; padding: 13px 16px; margin-bottom: 12px; border-left: 5px solid #0883F7; background: #eff6ff; }
.cp-ann.warning { border-color: #d97706; background: #fffbeb; } .cp-ann.emergency { border-color: #dc2626; background: #fef2f2; } .cp-ann.promo { border-color: #7c3aed; background: #f5f3ff; }
.cp-ann-t { font-weight: 800; font-size: .96rem; } .cp-ann-b { font-size: .85rem; margin-top: 3px; color: #334155; }

/* on-open prompts */
.cp-prompts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.cp-prompt { display: flex; align-items: center; gap: 13px; background: linear-gradient(135deg, #eff6ff, #fff); border: 1px solid #cfe0ff; border-radius: 14px; padding: 13px 16px; }
.cp-prompt > .cp-ic { color: #0883F7; flex: none; }
.cp-prompt-txt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.cp-prompt-txt b { font-size: .9rem; } .cp-prompt-txt span { font-size: .8rem; color: var(--lb-muted, #64748b); }
.cp-prompt-x { background: none; border: 0; color: #94a3b8; font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 0 4px; }

/* loads */
.cp-loadgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.cp-load { background: #fff; border: 1px solid var(--lb-border, #e6ebf3); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 11px; transition: transform .15s, box-shadow .15s, border-color .15s; }
.cp-load:hover { transform: translateY(-3px); border-color: #c9d6ec; box-shadow: 0 18px 40px -24px rgba(37,99,235,.5); }
.cp-load-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.cp-load-lane { font-weight: 800; font-size: .98rem; line-height: 1.3; } .cp-load-lane b { display: block; } .cp-arrow { color: var(--lb-blue, #0883F7); }
.cp-load-rate { text-align: right; font-weight: 800; font-size: 1.3rem; color: #0b1220; white-space: nowrap; } .cp-load-rate span { display: block; font-size: .74rem; color: var(--lb-orange, #FC5305); }
.cp-load-tags { display: flex; flex-wrap: wrap; gap: 6px; } .cp-tag { background: #f1f5f9; color: #475569; font-size: .74rem; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
.cp-load-meta { font-size: .78rem; color: var(--lb-muted, #64748b); }

/* trips / inline forms */
.cp-trip { padding: 13px 0; border-bottom: 1px solid #f1f5f9; } .cp-trip:last-child { border-bottom: 0; }
.cp-trip-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cp-trip-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; align-items: stretch; }
.cp-trip-actions > * { width: 100%; margin: 0; white-space: normal; }
@media (max-width:400px){ .cp-trip-actions { grid-template-columns: 1fr 1fr; } }
.cp-inlineform { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding: 12px; background: #f8fafc; border-radius: 11px; }

/* inputs & buttons */
.cp-in { width: 100%; padding: 11px 12px; border: 1px solid #d7dfea; border-radius: 11px; font-size: .92rem; font-family: inherit; background: #fff; }
textarea.cp-in { resize: vertical; }
.cp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px; border: 0; border-radius: 11px; background: var(--lb-blue, #0883F7); color: #fff; font-weight: 700; font-size: .9rem; cursor: pointer; margin-top: 8px; }
.cp-btn:hover { background: #1d4ed8; }
.cp-btn:disabled { opacity: .65; cursor: default; }
.cp-btn-lg { width: 100%; padding: 13px; margin-top: 18px; }
.cp-btn-sm { padding: 8px 13px; font-size: .84rem; margin: 0; }
.cp-btn.ghost { background: #eef2f7; color: #0b1220; } .cp-btn.ghost:hover { background: #e2e8f2; }

/* bottom tab bar (mobile only) */
.cp-tabbar { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .cp-shell { grid-template-columns: 1fr; }
  .cp-side { display: none; }
  .cp-top { padding: 12px 16px; gap: 10px; }
  .cp-top-title { font-size: 1.1rem; }
  /* agent shell: keep the page title compact so it never wraps under the bell/status chip */
  .cp-top .cp-title { font-size: 1.15rem; line-height: 1.2; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
  .cp-top-right { flex: none; }
  .cp-content { padding: 16px 14px 88px; }
  .cp-kpis { grid-template-columns: 1fr 1fr; }
  .cp-grid { grid-template-columns: 1fr; }
  .cp-col2 { grid-column: span 1; }
  /* bl_ui_0393 — the bar is real material, not a white strip: content passes UNDER a
     translucent, blurred surface (the iOS / Amazon / Uber treatment) with a hairline drawn
     as an inset shadow so it stays 1 device pixel on a 3x screen. Solid-white fallback below for
     engines without backdrop-filter — the bar must never turn see-through-unreadable. */
  .cp-tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: rgba(255,255,255,.82); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 0; box-shadow: inset 0 1px 0 rgba(16,34,59,.10), 0 -10px 30px -20px rgba(2,6,23,.45); padding: 7px 4px calc(7px + env(safe-area-inset-bottom)); justify-content: space-around; min-height: 58px; }
  @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .cp-tabbar { background: #fff; }
  }
  .cp-tabbar .cp-navlink { flex-direction: column; gap: 3px; padding: 6px 4px; font-size: .64rem; font-weight: 700; letter-spacing: .012em; color: #64748b; background: none; flex: 1; min-width: 0; text-align: center; border-radius: 12px; -webkit-tap-highlight-color: transparent; }
  .cp-tabbar .cp-navlink span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  /* bl_ui_0387 — variant B, the Uber/Amazon pattern: the active tab sits in a soft pill so
     the touch target reads as a real object. Presentational only — no tab, route or count
     changes. The dispatcher bar (.dw-bar) overrides this with its own rule in
     app/agent/dispatcher-workspace.js; that override is removed there so all four portals
     share one active state. */
  .cp-tabbar .cp-navlink { transition: background-color .2s cubic-bezier(.2,.8,.3,1), color .2s cubic-bezier(.2,.8,.3,1), transform .13s ease; }
  .cp-tabbar .cp-navlink.active { background: rgba(8,131,247,.11); color: var(--lb-blue, #0883F7); box-shadow: none; }
  /* bl_ui_0393 — what separates a premium bar from a coloured one: the active icon gains
     weight and lifts a pixel, the label goes heavier, and the pill settles with a spring.
     The stroke-width override works because every portal icon is a stroked 24x24 svg. */
  .cp-tabbar .cp-navlink svg { transition: stroke-width .2s ease, transform .2s cubic-bezier(.2,.8,.3,1); }
  .cp-tabbar .cp-navlink.active svg { stroke-width: 2.35; transform: translateY(-1px); }
  .cp-tabbar .cp-navlink.active span:not(.cp-tab-badge) { font-weight: 800; }
  .cp-tabbar .cp-navlink:active { transform: scale(.94); }
  @media (prefers-reduced-motion: reduce) {
    .cp-tabbar .cp-navlink, .cp-tabbar .cp-navlink svg { transition: none; }
    .cp-tabbar .cp-navlink:active { transform: none; }
    .cp-tabbar .cp-navlink.active svg { transform: none; }
  }
  /* bl_ui_0392 — variant C: the raised centre action. The bar is 4 destinations + one
     create action, the pattern Instagram/X/Uber Driver all use. .cp-fab is a real
     <button> (not a link — it opens a form in place, it is not a route), so it needs its
     own sizing: the .cp-navlink rules above only cover the four tabs. The disc is pulled
     up out of the bar, which is why .cp-tabbar must never get overflow:hidden. */
  /* bl_ui_0395 — font-family/size/weight are set separately on purpose: `font: 700 .64rem/1.2
     inherit` is invalid CSS (a CSS-wide keyword cannot sit inside the shorthand), so the whole
     declaration was dropped and this <button> fell back to the UA default — Arial 13.3px/400,
     next to Manrope 10.2px/700 on the four tabs beside it. */
  .cp-tabbar .cp-fab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border: 0; background: none; cursor: pointer; font-family: inherit; font-size: .64rem; font-weight: 700; line-height: 1.2; letter-spacing: .012em; color: #475569; text-align: center; -webkit-tap-highlight-color: transparent; }
  /* bl_ui_0393 — the disc is lit, not flat: a top highlight inside the gradient, a coloured
     ambient shadow under it and a ring in the bar's own colour so it reads as cut into the
     bar rather than stuck on top. It presses DOWN (scale + the shadow collapsing), which is
     the cue that tells a thumb the tap registered. */
  .cp-tabbar .cp-fab .cp-fab-in { width: 52px; height: 52px; margin-top: -22px; margin-bottom: -7px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; background: radial-gradient(120% 120% at 50% 0%, #3AA0FF 0%, #0883F7 48%, #0568CD 100%); border: 3px solid #fff; box-shadow: 0 10px 20px -8px rgba(8,131,247,.75), 0 2px 5px -1px rgba(2,6,23,.28), inset 0 1px 0 rgba(255,255,255,.45); transition: transform .13s cubic-bezier(.2,.8,.3,1), box-shadow .13s ease; }
  .cp-tabbar .cp-fab span:not(.cp-fab-in):not(.cp-ic) { white-space: nowrap; }
  .cp-tabbar .cp-fab:active .cp-fab-in { transform: translateY(2px) scale(.93); box-shadow: 0 4px 10px -6px rgba(8,131,247,.8), inset 0 1px 0 rgba(255,255,255,.3); }
  .cp-tabbar .cp-fab:focus-visible { outline: 2px solid #0883F7; outline-offset: -2px; border-radius: 12px; }
  @media (prefers-reduced-motion: reduce) { .cp-tabbar .cp-fab .cp-fab-in { transition: none; } .cp-tabbar .cp-fab:active .cp-fab-in { transform: none; } }
  /* show only the 5 most important tabs on mobile */
  .cp-tabbar .cp-navlink:nth-child(n+6) { display: none; }
}
@media (max-width: 460px) { .cp-kpis { grid-template-columns: 1fr 1fr; } .cp-stat-v { font-size: 1.25rem; } }

/* logo mark + tagline */
.cp-logo { display: inline-flex; width: 34px; height: 34px; align-items: center; justify-content: center; flex: none; } /* no synthetic box — the official icon IS the mark */

.cp-brandrow { margin-bottom: 4px; }

/* onboarding wizard (Phase 2A) */
.cp-wiz-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.cp-wiz-head h3 { font-size: 1rem; margin: 0; }
.cp-wiz-bar { height: 8px; background: #eef2f8; border-radius: 6px; overflow: hidden; margin-bottom: 16px; }

.cp-wiz-body { min-height: 180px; }
.cp-wiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cp-fld { display: flex; flex-direction: column; gap: 5px; }
.cp-fld .cp-in { margin-top: 0; }
.cp-wiz-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.cp-eqgrid { display: flex; flex-wrap: wrap; gap: 7px; }
.cp-chip2 { background: #f1f5f9; border: 1px solid #e2e8f2; color: #475569; font-size: .82rem; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.cp-chip2.on { background: #0883F7; border-color: #0883F7; color: #fff; }
.cp-wiz-done { text-align: center; padding: 26px 10px; }
.cp-wiz-done h3 { margin: 8px 0 4px; }
@media (max-width: 640px) { .cp-wiz-grid { grid-template-columns: 1fr; } }

/* notification bell badge + inbox */
.cp-bell { position: relative; }
.cp-bell-badge { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--lb-red, #dc2626); color: #fff; font-size: .66rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
.cp-notif { cursor: pointer; }
.cp-notif.unread { background: #f5f9ff; margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 8px; }
.cp-notif:hover { background: #eef4ff; }

/* Proof-of-delivery upload panel */
.cp-pod { margin-top: 10px; padding: 12px; background: #f8fafc; border-radius: 11px; }
.cp-podup { margin-top: 6px; }
.cp-podzone { border: 2px dashed #cbd5e1; border-radius: 11px; padding: 18px; text-align: center; cursor: pointer; background: #fff; transition: border-color .15s, background .15s; }
.cp-podzone:hover { border-color: #94a3b8; }
.cp-podzone.drag { border-color: var(--lb-orange, #FC5305); background: #fff7ed; }
.cp-podzone-t { font-weight: 700; color: #334155; margin-bottom: 4px; }
.cp-podprev { margin: 10px 0; }
.cp-podprev img { border: 1px solid #e2e8f0; }
.cp-podpdf { padding: 14px; background: #fff; border: 1px dashed #cbd5e1; border-radius: 8px; text-align: center; color: #475569; }

/* Modal (self-service forms: fleet, etc.) */
.cp-modal { position: fixed; inset: 0; z-index: 1000; background: rgba(15,23,42,.55); display: flex; align-items: flex-end; justify-content: center; padding: 0; animation: cpfade .15s ease; }
@keyframes cpfade { from { opacity: 0 } to { opacity: 1 } }
.cp-modal-card { background: #fff; width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; max-height: 92vh; overflow-y: auto; box-shadow: 0 -20px 60px -20px rgba(0,0,0,.4); }
/* 29 Aug 2026 — the modal scrolls with the browser's default fat grey bar, which looks
   broken against the dark theme. Same thin treatment .cp-side already uses. */
.cp-modal-card { scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.35) transparent; }
.cp-modal-card::-webkit-scrollbar { width: 6px; }
.cp-modal-card::-webkit-scrollbar-thumb { background: rgba(148,163,184,.35); border-radius: 99px; }
.cp-modal-card::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.55); }
.cp-modal-card::-webkit-scrollbar-track { background: transparent; }
.cp-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border, #e2e8f0); position: sticky; top: 0; z-index: 5; background: #fff; }
.cp-modal-head h3 { margin: 0; font-size: 1.05rem; }
.cp-modal-x { background: none; border: none; font-size: 26px; line-height: 1; color: #64748b; cursor: pointer; }
.cp-modal-body { padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 12px; }
.cp-modal-body .cp-in { margin: 0; }
.cp-formrow2 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
@media (min-width: 640px) { .cp-modal { align-items: center; } .cp-modal-card { border-radius: 18px; } }

/* Account menu (avatar dropdown) */
.cp-menuwrap { position: relative; }
.cp-avatar { border: none; cursor: pointer; }
.cp-menu { position: absolute; right: 0; top: 46px; z-index: 90; min-width: 240px; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 24px 60px -20px rgba(15,23,42,.35); padding: 8px; }
.cp-menu-id { padding: 10px 12px 12px; border-bottom: 1px solid #f1f5f9; margin-bottom: 6px; }
.cp-menu-name { font-weight: 800; font-size: .95rem; }
.cp-menu-mail { font-size: .8rem; color: #64748b; word-break: break-all; }
.cp-menu-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; cursor: pointer; padding: 10px 12px; border-radius: 10px; font: inherit; font-weight: 600; color: #10223B; }
.cp-menu-item:hover { background: #f1f5f9; }
.cp-menu-out { color: #dc2626; }
/* Labeled form fields (dispatch preferences etc.) */
.cp-field { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.cp-field > span { font-size: .85rem; font-weight: 600; color: #334155; }
.cp-input { padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font: inherit; width: 100%; background: #fff; }
.cp-input:focus { outline: none; border-color: #0883F7; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

/* FINAL locked lockup (owner): icon-L + "oadboot", boot BLUE — same as the website header */
.cp-brand b { color: inherit; }

/* Sidebar scrolling ON (owner ask) — long nav + account footer never get cut off.
   Shared by carrier, partner and developer portals (they all load carrier.css). */
.cp-side { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.35) transparent; }
.cp-side::-webkit-scrollbar { width: 6px; }
.cp-side::-webkit-scrollbar-thumb { background: rgba(148,163,184,.35); border-radius: 99px; }
.cp-side::-webkit-scrollbar-track { background: transparent; }

.cp-invalid { border-color: #dc2626 !important; box-shadow: 0 0 0 3px rgba(220,38,38,.12); }

/* ===================================================================== */
/* inDrive-style app experience — OFFICIAL LoadBoot palette only          */
/* (navy #0F172A/#0b1220, orange var(--lb-orange,#FC5305), blue #0883F7, slate #64748B)    */
/* ===================================================================== */

/* ---- Theme: light (default) / dark, switchable Off/On/System ---- */
html[data-lbtheme="dark"] body { background: #0b1220; color: #e2e8f0; }

html[data-lbtheme="dark"] .cpx-req { background: #111c33; border-color: rgba(255,255,255,.09); color: #e2e8f0; }

 { background: #0b1220; border-color: rgba(255,255,255,.14); color: #e2e8f0; }

 { background: rgba(255,255,255,.07); color: #e2e8f0; border-color: rgba(255,255,255,.14); }

@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  html[data-lbtheme="dark"] .cp-tabbar { background: #0e1830; }
}

html[data-lbtheme="dark"] .cp-tabbar .cp-fab .cp-fab-in { border-color: #0e1830; box-shadow: 0 10px 22px -8px rgba(8,131,247,.85), 0 2px 5px -1px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35); }
html[data-lbtheme="dark"] .cp-tab-badge { border-color: #0e1830; }
html[data-lbtheme="dark"] .cp-tag { background: rgba(8,131,247,.16); color: #93c5fd; }
html[data-lbtheme="dark"] .cp-row { border-color: rgba(255,255,255,.07); }

/* ---- Top bar: hamburger + availability pill (inDrive pattern) ---- */
.cp-top-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cpx-burger { display: none; background: none; border: 0; color: inherit; cursor: pointer; padding: 6px; border-radius: 10px; }
.cpx-avail { border-radius: 999px; font-weight: 800; font-size: .82rem; padding: 7px 16px; cursor: pointer; border: 2px solid transparent; font-family: inherit; letter-spacing: .02em; }
.cpx-avail.on { background: var(--lb-orange,#FC5305); color: #fff; box-shadow: 0 6px 18px -6px rgba(252,83,5,.55); }
.cpx-avail.off { background: transparent; color: #dc2626; border-color: rgba(220,38,38,.55); }
html[data-lbtheme="dark"] .cpx-avail.off { color: #fca5a5; }

/* ---- Side drawer (brand navy, both themes) ---- */
.cpx-scrim { position: fixed; inset: 0; background: rgba(2,6,23,.55); z-index: 98; opacity: 0; transition: opacity .2s; }
.cpx-scrim.show { opacity: 1; }
.cpx-drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 300px; max-width: 84vw; background: #0b1220; color: #fff; z-index: 99; transform: translateX(-102%); transition: transform .22s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; padding: 18px 0 12px; box-shadow: 24px 0 60px -30px rgba(2,6,23,.8); }
.cpx-drawer.show { transform: none; }
.cpx-d-head { display: flex; align-items: center; gap: 12px; padding: 10px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.08); cursor: pointer; }
.cpx-d-ava { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg,#0883F7,#1d4ed8); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #fff; flex: none; }
.cpx-d-name { font-weight: 800; font-size: 15px; }
.cpx-d-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }

.cpx-d-item { display: flex; align-items: center; gap: 14px; padding: 12px 12px; border-radius: 12px; color: #e2e8f0; font-weight: 700; font-size: 14px; background: none; border: 0; cursor: pointer; text-align: left; font-family: inherit; width: 100%; }
.cpx-d-item:hover, .cpx-d-item.active { background: rgba(255,255,255,.07); }
.cpx-d-item .cp-ic { color: #94a3b8; }
.cpx-d-badge { margin-left: auto; background: #dc2626; color: #fff; font-size: 11px; font-weight: 800; border-radius: 99px; padding: 2px 8px; }
.cpx-d-foot { padding: 10px 14px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,.08); }
/* ---- Drawer v2 (inDrive-class): rating row, chevron, live stats, availability CTA ---- */
.cpx-drawer { width: 320px; }
.cpx-d-head { padding: 12px 18px 16px; gap: 13px; }
.cpx-d-head:active { background: rgba(255,255,255,.04); }
.cpx-d-rating { font-size: 13.5px; font-weight: 800; color: var(--lb-orange,#FC5305); margin-top: 2px; letter-spacing: .01em; }

.cpx-d-avadot { position: absolute; right: -1px; bottom: -1px; width: 14px; height: 14px; border-radius: 50%; background: #22c55e; border: 2.5px solid #0b1220; }
.cpx-d-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; padding: 12px 12px 4px; }
.cpx-d-stat { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.07); border-radius: 12px; padding: 9px 6px; text-align: center; color: #fff; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; gap: 2px; }
.cpx-d-stat b { font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; }

.cpx-d-pill { margin-left: auto; background: rgba(217,119,6,.2); color: #fbbf24; font-size: 9.5px; font-weight: 800; border-radius: 99px; padding: 3px 8px; white-space: nowrap; }

.cpx-d-cta.on { background: var(--lb-orange,#FC5305); color: #fff; box-shadow: 0 12px 28px -12px rgba(252,83,5,.65); }
.cpx-d-cta.off { background: transparent; color: #fca5a5; border: 1.5px solid rgba(220,38,38,.5); }
.cpx-d-cta:disabled { opacity: .7; }
.cpx-d-site { text-align: center; font-size: 10px; color: #475569; margin-top: 9px; font-weight: 600; letter-spacing: .02em; }
/* Customize: bottom-tab shortcut picker chips (Settings) */
.cpx-tabpick { border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: .82rem; border: 1.5px solid var(--lb-border, #d7dfea); background: transparent; color: inherit; cursor: pointer; font-family: inherit; }
.cpx-tabpick.on { background: #0F172A; color: #fff; border-color: #0F172A; }
html[data-lbtheme="dark"] .cpx-tabpick { border-color: rgba(255,255,255,.16); }
html[data-lbtheme="dark"] .cpx-tabpick.on { background: var(--lb-orange,#FC5305); border-color: var(--lb-orange,#FC5305); }

/* ---- Alert banners (inDrive pattern, status colours) ---- */
.cpx-banner { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 13px 16px; font-weight: 700; font-size: .92rem; cursor: pointer; margin-bottom: 10px; border: 0; width: 100%; text-align: left; font-family: inherit; }

.cpx-banner.amber { background: #fef3c7; color: #92400e; }

html[data-lbtheme="dark"] .cpx-banner.amber { background: rgba(217,119,6,.16); color: #fcd34d; }

/* ---- Load request cards (inDrive request-list pattern) ---- */
.cpx-req { display: flex; flex-direction: column; gap: 10px; }
.cpx-req-rate { display: flex; align-items: baseline; gap: 10px; }
.cpx-req-rate .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.cpx-req-rate .rpm { font-size: 13px; font-weight: 700; color: #0883F7; }
.cpx-req-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.cpx-chip { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: rgba(8,131,247,.12); color: #1d4ed8; }
html[data-lbtheme="dark"] .cpx-chip { background: rgba(8,131,247,.2); color: #93c5fd; }
.cpx-chip.eq { background: rgba(252,83,5,.13); color: #c2540a; }

.cpx-pt.to .cpx-dot { border-color: #16a34a; }
.cpx-pt .sub { font-weight: 500; font-size: 12px; color: #64748b; }

/* ---- Settings (inDrive pattern) ---- */
.cpx-set-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--lb-border, #e6ebf3); }

.cpx-set-t { font-weight: 800; font-size: 14.5px; }
.cpx-set-s { font-size: 12.5px; color: #64748b; margin-top: 2px; }
.cpx-seg { display: flex; gap: 8px; margin-left: auto; }

/* ---- Mobile: hamburger visible, tighter top bar ---- */

  .cpx-burger { display: block; }
  .cpx-avail { font-size: .78rem; padding: 6px 13px; }

}

.cpx-auth-split { display: flex; align-items: stretch; gap: 0; width: 100%; max-width: 880px; border-radius: 24px; overflow: hidden; box-shadow: 0 40px 100px -35px rgba(2,6,23,.75); }

  background:
    radial-gradient(430px 280px at 88% 92%, rgba(252,83,5,.16), transparent 70%),
    radial-gradient(540px 340px at 8% 6%, rgba(8,131,247,.18), transparent 70%),
    linear-gradient(160deg, #0e1c38 0%, #0b1220 55%, #0d1830 100%); }

}

/* Auth brand panel — carrier problem/solution mockup (pure CSS, on-brand) */
.cpx-mockstack { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; max-width: 300px; }
.cpx-mockcard { background: #fff; border-radius: 14px; padding: 14px; color: #0F172A; box-shadow: 0 20px 50px -18px rgba(2,6,23,.7); transform: rotate(-1deg); }

.cpx-mockroute { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; margin-top: 8px; }
.cpx-mockroute .d { width: 10px; height: 10px; border-radius: 50%; border: 3px solid #0883F7; flex: none; }

/* 29 Aug 2026 — premium scrollbars EVERYWHERE. The browser default fat grey bar was
   showing on every scroll container that never got the .cp-side/.cc-side treatment
   (modals, drawers, tables, panels, the page itself). One global rule instead of
   chasing each container; anything that hides its bar (scrollbar-width:none) or sets
   its own width is more specific and still wins. height:6px covers horizontal bars
   on table wraps. */
* { scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.38) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-thumb { background: rgba(148,163,184,.38); border-radius: 99px; }
*::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.6); }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-corner { background: transparent; }

/* ---------- bl_ux_0320 (4 Sep 2026): collapsible sidebar / icon rail ----------
   Pinned open (250px) or collapsed to a 72px icon rail via the toggle at the top of the
   sidebar or the "[" key — never hover-expand. shared/ui/sideRail.js owns the state.
   Below 900px the sidebar is hidden anyway (burger/drawer + tab bar take over). */
.cp-shell { transition: grid-template-columns .2s cubic-bezier(.4,0,.2,1); }
.cp-side { position: sticky; }
.cp-rail-tg { position: absolute; top: 18px; right: 10px; width: 30px; height: 30px; border-radius: 9px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.05); color: #8fa0bd; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; z-index: 3; transition: background .15s, color .15s; }
.cp-rail-tg:hover, .cp-rail-tg:focus-visible { background: rgba(255,255,255,.12); color: #fff; outline: none; }
.cp-side .cp-brandrow { padding-right: 40px; min-height: 30px; }
.cp-shell--rail { grid-template-columns: 72px 1fr; }
.cp-shell--rail .cp-side { padding: 18px 12px; align-items: center; gap: 12px; }
.cp-shell--rail .cp-rail-tg { position: static; margin: 0 auto; order: 1; }
.cp-shell--rail .cp-side .cp-brandrow { padding: 0; margin: 0; justify-content: center; order: 0; }
.cp-shell--rail .cp-side .cp-brandrow .cc-brandrow > span + span { display: none !important; }   /* wordmark + descriptor (inline style) */
.cp-shell--rail .cp-side .cp-brandrow .cc-brandrow > span:first-child svg { width: 26px; height: 27px; }
.cp-shell--rail .cp-nav { order: 2; width: 100%; align-items: center; margin-top: 4px; }
/* bl_ui_0397 — these three are scoped to .cp-nav, the SIDEBAR's nav, on purpose. Unscoped they
   also matched .cp-tabbar .cp-navlink, and the rail auto-collapses under 1279px — which every
   phone is — so the bottom bar lost its labels and its items became 46x44 icon squares on every
   phone, in the carrier, agent and broker portals. (The dispatcher bar had been patched around
   it locally with !important in dispatcher-workspace.js; that is why only IT looked right.)
   The rail is a desktop sidebar layout and must never reach the bottom bar. */
.cp-shell--rail .cp-nav .cp-navlink { width: 46px; height: 44px; padding: 0; justify-content: center; gap: 0; border-radius: 12px; }
.cp-shell--rail .cp-nav .cp-navlink > span:not(.cp-ic):not(.cc-ico):not(.cp-tab-badge) { display: none; }
.cp-shell--rail .cp-nav .cp-navlink .cp-tab-badge { top: 4px; right: 4px; }
.cp-shell--rail .cp-side-foot { order: 3; width: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 12px; }
.cp-shell--rail .cp-side-foot .cp-carrier { display: none; }
.cp-shell--rail .cp-side-out { width: 46px; height: 42px; padding: 0; margin-top: 0; border-radius: 12px; }
.cp-shell--rail .cp-side-out > span:not(.cp-ic):not(.cc-ico) { display: none; }
.cp-shell--rail .cp-side > * { flex: none; }
.cp-shell--rail .cp-nav { flex: 1 1 auto; overflow-y: auto; scrollbar-width: none; }
.cp-shell--rail .cp-nav::-webkit-scrollbar { display: none; }
.cp-railtip { position: fixed; z-index: 1000; transform: translateY(-50%) translateX(-4px); background: #0f172a; color: #fff; font: 600 .78rem/1.2 var(--lb-body, system-ui, sans-serif); padding: 7px 11px; border-radius: 9px; white-space: nowrap; box-shadow: 0 10px 30px -10px rgba(15,23,42,.55); pointer-events: none; opacity: 0; transition: opacity .12s, transform .12s; }
.cp-railtip::before { content: ''; position: absolute; left: -5px; top: 50%; width: 10px; height: 10px; background: inherit; transform: translateY(-50%) rotate(45deg); border-radius: 2px; }
.cp-railtip.show { opacity: 1; transform: translateY(-50%) translateX(0); }
@media (max-width: 900px) {
  .cp-rail-tg, .cp-railtip { display: none !important; }
  /* bl_ux_0320 FIX, 2026-09-10 — the rail is a DESKTOP layout only.
     This block already hid the rail's toggle on phones, but the track itself was missed:
     `.cp-shell--rail` above sits LATER in this file than the `@media (max-width:900px)`
     responsive block that sets `.cp-shell{grid-template-columns:1fr}`, and both are a single
     class, so the rail's `72px 1fr` won on source order. `.cp-side` is display:none here, so
     `.cp-main` was auto-placed INTO the empty 72px track.
     Measured at 360px before this fix: grid "72px 288px", .cp-main 72px wide, and
     .cp-top-right (left 26 → right 182) drawn straight over .cp-top-title (left 53 → 158) —
     the overlapping top bar and the one-word-per-line cards the phone was showing. */
  .cp-shell--rail { grid-template-columns: 1fr; }
  /* The title is an <h1 class="cp-top-title">, which never got the shrink treatment the
     `.cp-title` variant has above — without this a long tab name pushes the bell and avatar
     off the right edge instead of ellipsing. */
  .cp-top-title { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
@media (prefers-reduced-motion: reduce) { .cp-shell { transition: none; } }

.dd-check{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.14);color:#8ea2c3}
.dd-check.on{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.5);color:#6ee7b7}
.dd-row .l{flex:1;min-width:0}.dd-row .l b{display:block;color:#eaf1fb;font-size:.9rem}.dd-row .l span{display:block;color:#8ea2c3;font-size:.76rem;margin-top:1px}
.dd-row a.fix{font-size:.78rem;font-weight:800;color:#8ec5ff;text-decoration:none;white-space:nowrap}
.dd-ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(#0883F7 calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;flex:none}
.dd-ring i{width:50px;height:50px;border-radius:50%;background:#111c31;display:grid;place-items:center;font-style:normal;font-weight:900;color:#fff;font-size:.9rem}
.dd-faq{border-top:1px solid rgba(255,255,255,.07)}
.dd-faq summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:12px 4px;font-weight:800;color:#eaf1fb;font-size:.92rem}
.dd-faq summary::-webkit-details-marker{display:none}
.dd-faq summary .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(8,131,247,.14);color:#8ec5ff;flex:none}
.dd-faq p{margin:0 0 12px 44px;color:#b9c8e2;font-size:.86rem;line-height:1.55}
.dd-thread{height:300px;overflow:auto;padding:4px 2px;margin:8px 0;display:grid;gap:6px;align-content:start}
.dd-msg{max-width:84%;padding:8px 11px;border-radius:14px;font-size:.88rem;line-height:1.4;white-space:pre-wrap}
.dd-msg.me{margin-left:auto;background:rgba(8,131,247,.2);border:1px solid rgba(8,131,247,.38)}
.dd-msg.them{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.dd-msg.sys{max-width:100%;text-align:center;border:1px dashed rgba(255,255,255,.18);font-size:.8rem;opacity:.85}
.dd-msg .who{font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.65;margin-bottom:2px}
.dd-call{display:flex;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid rgba(255,255,255,.07)}
.dd-call .dir{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.05);color:#8ea2c3}
.dd-call .dir.in{color:#6ee7b7}.dd-call .dir.out{color:#8ec5ff}
.dd-call .m{flex:1;min-width:0}.dd-call .m b{display:block;color:#eaf1fb;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dd-call .m span{color:#8ea2c3;font-size:.74rem}
.dd-call .d{font-size:.78rem;color:#b9c8e2;white-space:nowrap}
.dd-cta{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:14px;background:#0883F7;color:#fff;font-weight:800;border:0;cursor:pointer;font-size:.92rem;box-shadow:0 12px 26px -12px rgba(8,131,247,.9)}
.dd-cta.ghost{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid rgba(255,255,255,.14)}
.dd-cta.danger{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.4);box-shadow:none}
.dd-btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.dd-wrap{container-type:inline-size}
