# codemagic.yaml — LoadBoot iOS shell → TestFlight / App Store, built on Codemagic's
# macOS M-series machines (no Mac needed). Docs: docs/APPLE-LAUNCH-GUIDE.md
#
# ONE-TIME SETUP IN CODEMAGIC (UI):
#   Teams → Integrations → App Store Connect → add API key, name it exactly:  LoadBoot ASC
#   (Key from App Store Connect → Users and Access → Integrations → Team keys, role "App Manager".)
#   Then: Apps → Add application → this GitHub repo → "codemagic.yaml" → run workflow ios-testflight.
#
# Codemagic creates the distribution certificate + provisioning profile itself
# (`app-store-connect fetch-signing-files --create`). No .p12 / .mobileprovision juggling.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2          # 500 free min/month on a personal account
    max_build_duration: 60
    working_directory: tools/ios
    integrations:
      app_store_connect: LoadBoot ASC
    environment:
      xcode: latest                     # Apple requires Xcode 26 / iOS 26 SDK for submissions (since 28 Apr 2026)
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.loadboot.app
      vars:
        APP_STORE_APP_ID: "0000000000"   # ← set to the numeric Apple ID of the app (App Store Connect → App Information)
        BUNDLE_ID: com.loadboot.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        MARKETING_VERSION: "1.0.0"
    triggering:
      events: [tag]                     # push a git tag like ios-v1.0.0 to build
      tag_patterns:
        - pattern: 'ios-v*'
      cancel_previous_builds: true
    scripts:
      - name: Install web-side deps (Capacitor CLI + plugins)
        script: npm ci
      - name: Generate native project + apply LoadBoot iOS config
        script: |
          rm -rf ios
          npx cap add ios
          bash scripts/apply-ios-config.sh
          npm run assets
          npx cap sync ios
      - name: Set version / build number
        script: |
          cd ios/App
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0) + 1))
          agvtool new-version -all "$BUILD_NUMBER"
          agvtool new-marketing-version "$MARKETING_VERSION"
          echo "Building $MARKETING_VERSION ($BUILD_NUMBER)"
      - name: Apply code-signing profiles
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build IPA
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/build/**/*.dSYM
    publishing:
      email:
        recipients:
          - hello@loadboot.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - LoadBoot Internal
        submit_to_app_store: false      # flip to true (with release_type) once TestFlight is green

  ios-simulator-check:
    name: iOS → compile check (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: tools/ios
    environment:
      xcode: latest
      node: 22
    triggering:
      events: [push]
      branch_patterns:
        - pattern: 'ios/*'
    scripts:
      - name: Install
        script: npm ci
      - name: Generate + config
        script: |
          rm -rf ios
          npx cap add ios
          bash scripts/apply-ios-config.sh
          npm run assets
          npx cap sync ios
      - name: Build for simulator
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | xcpretty || true
