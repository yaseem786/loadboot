name: Nightly backup (prod DB + Storage)

# Free-plan Supabase takes NO backups of its own, so this workflow is the only
# copy of LoadBoot production data. See docs/BACKUP-RESTORE.md
on:
  schedule:
    - cron: '45 9 * * *'      # 09:45 UTC daily (~02:45 America/Los_Angeles)
  workflow_dispatch:           # "Run workflow" button for an on-demand backup

concurrency:
  group: prod-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # Bucket was created with the United States jurisdiction, so the S3 endpoint
      # carries the '.us.' segment. A plain <account>.r2.cloudflarestorage.com
      # endpoint will NOT find this bucket.
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.us.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BACKUP_AGE_PUBKEY: ${{ secrets.BACKUP_AGE_PUBKEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump 17 + age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
          pg_dump --version && age --version
          # The repo is edited on Windows; strip CR so bash/python never see CRLF.
          sed -i 's/\r$//' scripts/backup/backup_db.sh scripts/backup/backup_storage.py

      - name: Database dump -> encrypt -> R2
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/backup/backup_db.sh

      - name: Storage objects (carrier documents) -> encrypt -> R2  [weekly]
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OUT_DIR: storage-dump
        run: |
          set -Eeuo pipefail
          # Carrier documents change slowly, and a full 141 MB tarball every night
          # would eat the 10 GB R2 free tier. Sundays + the 1st + manual runs only.
          if [ "$(date -u +%u)" != "7" ] && [ "$(date -u +%d)" != "01" ] \
             && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "skip: storage archive runs Sundays, the 1st, and on manual runs"; exit 0
          fi
          STAMP="$(date -u +%Y-%m-%d)"
          python3 scripts/backup/backup_storage.py
          tar -czf "storage-$STAMP.tar.gz" storage-dump
          age -r "$BACKUP_AGE_PUBKEY" -o "storage-$STAMP.tar.gz.age" "storage-$STAMP.tar.gz"
          rm -rf storage-dump "storage-$STAMP.tar.gz"
          aws s3 cp "storage-$STAMP.tar.gz.age" \
            "s3://$R2_BUCKET/daily/$STAMP/" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          if [ "$(date -u +%d)" = "01" ]; then
            aws s3 cp "storage-$STAMP.tar.gz.age" \
              "s3://$R2_BUCKET/monthly/$STAMP/" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          fi

      - name: Prune daily backups older than 30 days
        run: |
          set -Eeuo pipefail
          CUTOFF="$(date -u -d '30 days ago' +%Y-%m-%d)"
          aws s3 ls "s3://$R2_BUCKET/daily/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $2}' | tr -d '/' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' > days.txt || true
          while read -r d; do
            [ -z "$d" ] && continue
            if [[ "$d" < "$CUTOFF" ]]; then
              echo "deleting daily/$d"
              aws s3 rm "s3://$R2_BUCKET/daily/$d" --recursive \
                --endpoint-url "$R2_ENDPOINT" --only-show-errors
            fi
          done < days.txt

      - name: Report what is now in R2
        run: |
          aws s3 ls "s3://$R2_BUCKET/daily/$(date -u +%Y-%m-%d)/" \
            --endpoint-url "$R2_ENDPOINT" --human-readable
